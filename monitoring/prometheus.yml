global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dolda-local'
    environment: 'docker-compose'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # DOLDA nodes
  - job_name: 'dolda'
    static_configs:
      - targets:
          - 'dolda-node1:9090'
          - 'dolda-node2:9090'
          - 'dolda-node3:9090'
        labels:
          cluster: 'dolda-local'
    
    # Relabeling
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'dolda-node(\d+):.*'
        target_label: node_id
        replacement: '${1}'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (if running)
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'

