[package]
name = "dolda"
version = "0.1.0"
edition = "2021"
authors = ["DOLDA Team"]
description = "DolphinDB-inspired Distributed Database Architecture in Rust"
license = "MIT OR Apache-2.0"
keywords = ["distributed", "database", "dolphindb", "rust"]
categories = ["database", "concurrency"]

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "net", "time", "fs", "io-util", "macros", "signal"] }
parking_lot = "0.12"
crc32fast = "1.3"
dashmap = "5.5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.6", features = ["v4"] }
memmap2 = "0.9"
sysinfo = "0.30"
toml = "0.8"
# Production observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
# Production features
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.10"
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
rand = "0.8"

[[bench]]
name = "storage_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
