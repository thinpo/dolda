apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dolda

resources:
  - namespace.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml
  # Uncomment if using Prometheus Operator
  # - servicemonitor.yaml

commonLabels:
  app: dolda
  version: v0.1.0

images:
  - name: dolda
    newName: your-registry/dolda
    newTag: latest

# ConfigMap generator (alternative to configmap.yaml)
# configMapGenerator:
#   - name: dolda-config
#     literals:
#       - RUST_LOG=info
#       - DOLDA_LOG_LEVEL=info

# Patches for different environments
patchesStrategicMerge:
  # Add environment-specific patches here
  # - production-patch.yaml
  # - staging-patch.yaml

