apiVersion: v1
kind: ConfigMap
metadata:
  name: dolda-config
  namespace: dolda
  labels:
    app: dolda
data:
  # Logging configuration
  RUST_LOG: "info"
  RUST_BACKTRACE: "1"
  
  # DOLDA configuration
  DOLDA_LOG_LEVEL: "info"
  DOLDA_LISTEN_ADDR: "0.0.0.0:8080"
  DOLDA_RAFT_ADDR: "0.0.0.0:7000"
  DOLDA_HEALTH_ADDR: "0.0.0.0:8081"
  DOLDA_METRICS_ADDR: "0.0.0.0:9090"
  DOLDA_DATA_DIR: "/data"
  
  # Raft configuration
  DOLDA_RAFT_HEARTBEAT_MS: "150"
  DOLDA_RAFT_ELECTION_TIMEOUT_MIN_MS: "300"
  DOLDA_RAFT_ELECTION_TIMEOUT_MAX_MS: "600"
  
  # Storage configuration
  DOLDA_SEGMENT_SIZE_MB: "256"
  DOLDA_MAX_SEGMENTS: "1000"
  DOLDA_COMPACTION_THRESHOLD: "0.7"
  
  # Performance tuning
  DOLDA_WRITE_BUFFER_SIZE: "65536"
  DOLDA_MAX_CONCURRENT_WRITES: "1000"

